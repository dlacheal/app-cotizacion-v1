<div class="container py-4">
    <div class="card">
        <div class="card-header d-flex align-items-center justify-content-between p-4">
            <h5 class="mb-0 fw-bold text-dark d-flex align-items-center">
                <i class="bi bi-file-earmark-spreadsheet-fill me-2 text-primary"></i>
                Generador de Cotización
            </h5>
            <span class="badge bg-light text-secondary border px-3 py-2 fw-semibold">ID: {{ cotizacion.idCotizacion || 'Nueva' }}</span>
        </div>
        <div class="card-body p-4">

            <!-- 1. Cabecera y datos generales de la cotización -->
            <div class="mb-4">
                <div class="mb-4">
                    <cotizacion-view [idCotizacion]="cotizacion.idCotizacion" [fecha]="cotizacion.fecha"
                        [usuarioUsername]="cotizacion.usuarioUsername">
                    </cotizacion-view>
                </div>

                <!-- Datos del Cliente (Sin bordes de tarjeta rígidos, estilo sección limpia) -->
                <div class="pb-4 mb-4 border-bottom">
                    <div class="d-flex align-items-center mb-3">
                        <h6 class="mb-0 fw-bold text-dark fs-5">
                            <i class="bi bi-person-bounding-box me-2 text-primary"></i>
                            Datos del Cliente
                        </h6>
                    </div>
                    <div class="row g-3">
                        <!-- Combobox: Seleccionar Cliente Existente -->
                        <div class="col-12 pb-2 custom-select-dropdown position-relative">
                            <label for="selectCliente" class="form-label">Buscar o Seleccionar Cliente</label>
                            
                            <div class="dropdown">
                                <button class="form-select text-start d-flex justify-content-between align-items-center bg-white py-2 px-3 shadow-none" 
                                        type="button" (click)="toggleDropdown()" [disabled]="!isNueva" style="min-height: 38px;">
                                    <span>{{ getSelectedClienteLabel() }}</span>
                                </button>
                                
                                <div class="dropdown-menu w-100 p-2 shadow-lg border border-light-subtle rounded-3 mt-1" 
                                     [class.show]="isOpen" 
                                     style="max-height: 250px; overflow-y: auto; display: block; visibility: hidden; opacity: 0; transition: all 0.15s ease-in-out;"
                                     [style.visibility]="isOpen ? 'visible' : 'hidden'"
                                     [style.opacity]="isOpen ? '1' : '0'">
                                    
                                    <!-- Buscador de texto dentro del combo -->
                                    <div class="input-group input-group-sm mb-2">
                                        <span class="input-group-text bg-light border border-secondary-subtle"><i class="bi bi-search text-secondary"></i></span>
                                        <input type="text" class="form-control border border-secondary-subtle" placeholder="Buscar cliente por nombre o RUC/DNI..." [(ngModel)]="filtroCliente" (click)="$event.stopPropagation()" />
                                    </div>
                                    
                                    <!-- Opción manual -->
                                    <button class="dropdown-item fw-bold text-success py-2 rounded" type="button" (click)="selectCliente('nuevo')">
                                        <i class="bi bi-person-plus-fill me-2"></i>+ Registrar Nuevo Cliente (Manual)
                                    </button>
                                    
                                    <div class="dropdown-divider"></div>
                                    
                                    <!-- Opciones de clientes filtrados -->
                                    @for (c of clientesFiltrados; track c.idCliente) {
                                        <button class="dropdown-item py-2 rounded text-truncate" type="button" (click)="selectCliente(c.idCliente)">
                                            <i class="bi bi-person me-2 text-secondary"></i>{{ c.nombre }} ({{ c.rucDni }})
                                        </button>
                                    } @empty {
                                        <span class="dropdown-item text-muted small py-2">No se encontraron clientes</span>
                                    }
                                </div>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label for="clienteNombre" class="form-label">Razón Social / Nombre *</label>
                            <input type="text" id="clienteNombre" class="form-control"
                                [(ngModel)]="cotizacion.clienteNombre" placeholder="Nombre completo o Razón Social" required
                                [disabled]="selectedClienteId !== 'nuevo' && selectedClienteId !== ''" />
                        </div>
                        <div class="col-md-6">
                            <label for="clienteRucDni" class="form-label">RUC / DNI *</label>
                            <input type="text" id="clienteRucDni" class="form-control"
                                [(ngModel)]="cotizacion.clienteRucDni" placeholder="Identificación fiscal" required
                                [disabled]="selectedClienteId !== 'nuevo' && selectedClienteId !== ''" />
                        </div>
                        <div class="col-md-4">
                            <label for="clienteTelefono" class="form-label">Teléfono</label>
                            <input type="text" id="clienteTelefono" class="form-control"
                                [(ngModel)]="cotizacion.clienteTelefono" placeholder="Teléfono de contacto"
                                [disabled]="selectedClienteId !== 'nuevo' && selectedClienteId !== ''" />
                        </div>
                        <div class="col-md-4">
                            <label for="clienteEmail" class="form-label">Correo Electrónico</label>
                            <input type="email" id="clienteEmail" class="form-control"
                                [(ngModel)]="cotizacion.clienteEmail" placeholder="Email corporativo"
                                [disabled]="selectedClienteId !== 'nuevo' && selectedClienteId !== ''" />
                        </div>
                        <div class="col-md-4">
                            <label for="clienteDireccion" class="form-label">Dirección</label>
                            <input type="text" id="clienteDireccion" class="form-control"
                                [(ngModel)]="cotizacion.clienteDireccion" placeholder="Domicilio legal"
                                [disabled]="selectedClienteId !== 'nuevo' && selectedClienteId !== ''" />
                        </div>
                    </div>
                </div>

                <!-- Parámetros del Documento (Estilo sección limpia) -->
                <div class="pb-4 mb-4 border-bottom">
                    <div class="d-flex align-items-center mb-3">
                        <h6 class="mb-0 fw-bold text-dark fs-5">
                            <i class="bi bi-sliders me-2 text-primary"></i>
                            Parámetros Comerciales
                        </h6>
                    </div>
                    <div class="row g-3">
                        <!-- Combobox: Moneda -->
                        <div class="col-md-3">
                            <label for="monedaCodigo" class="form-label">Moneda *</label>
                            <select id="monedaCodigo" class="form-select" [(ngModel)]="cotizacion.monedaCodigo" required>
                                <option value="" disabled selected>Seleccione Moneda</option>
                                @for (m of monedas; track m.idMoneda) {
                                <option [value]="m.codigo">{{ m.descripcion }} ({{ m.codigo }})</option>
                                }
                            </select>
                        </div>

                        <!-- Combobox: Forma de Pago -->
                        <div class="col-md-3">
                            <label for="formaPagoNombre" class="form-label">Forma de Pago *</label>
                            <select id="formaPagoNombre" class="form-select" [(ngModel)]="cotizacion.formaPagoNombre" required>
                                <option value="" disabled selected>Seleccione Forma de Pago</option>
                                @for (fp of metodosPago; track fp.idFormaPago) {
                                <option [value]="fp.nombre">{{ fp.nombre }}</option>
                                }
                            </select>
                        </div>

                        <!-- Combobox: Estado de la Cotización -->
                        <div class="col-md-3">
                            <label for="estadoNombre" class="form-label">Estado *</label>
                            <select id="estadoNombre" class="form-select" [(ngModel)]="cotizacion.estadoNombre" required>
                                <option value="" disabled selected>Seleccione Estado</option>
                                @for (est of estados; track est.idEstado) {
                                <option [value]="est.nombre">{{ est.nombre }}</option>
                                }
                            </select>
                        </div>

                        <!-- Ingreso Manual: Validez en Días -->
                        <div class="col-md-3">
                            <label for="validezDias" class="form-label">Validez (Días) *</label>
                            <input type="number" id="validezDias" class="form-control"
                                [(ngModel)]="cotizacion.validezDias" placeholder="Ej. 15" required min="1" />
                        </div>

                        <!-- Ingreso Manual: Observaciones -->
                        <div class="col-12">
                            <label for="observaciones" class="form-label">Observaciones</label>
                            <textarea id="observaciones" class="form-control" rows="2"
                                [(ngModel)]="cotizacion.observaciones"
                                placeholder="Condiciones o notas adicionales de la cotización..."></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 2. Formulario para agregar productos -->
            <div class="pb-4 mb-4 border-bottom">
                <cotizacion-form-item (addItemEventEmitter)="addItem($event)"></cotizacion-form-item>
            </div>

            <!-- 3. Lista de productos cotizados (Detalle) -->
            <div class="pb-4 mb-4 border-bottom">
                <h6 class="text-dark mb-3 fw-bold fs-5 d-flex align-items-center">
                    <i class="bi bi-list-task me-2 text-primary"></i>
                    Productos Cotizados
                </h6>
                <list-item [detalles]="cotizacion.detalles" [isNueva]="true" (removeEventEmitter)="onRemoveItem($event)"></list-item>
            </div>

            <!-- 4. Resumen / Totales de la cotización -->
            <div class="row justify-content-end mb-4">
                <div class="col-lg-8 col-md-10">
                    <cotizacion-view2 [inversionTotal]="cotizacion.inversionTotal"
                        [utilidadBrutaTotal]="cotizacion.utilidadBrutaTotal" [subTotal]="cotizacion.subTotal"
                        [montoIgv]="cotizacion.montoIgv" [totalGeneral]="cotizacion.totalGeneral">
                    </cotizacion-view2>
                </div>
            </div>

            <!-- Botones de Acción -->
            <div class="row pt-2">
                <div class="col-12 text-end">
                    @if (isNueva) {
                        <button type="button" (click)="guardarCotizacion()" class="btn btn-primary px-5 py-2.5 fw-semibold d-inline-flex align-items-center gap-2" [disabled]="isSaving">
                            @if (isSaving) {
                                <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                                Procesando...
                            } @else {
                                <i class="bi bi-cloud-arrow-up-fill fs-5"></i>
                                Registrar Cotización
                            }
                        </button>
                    } @else {
                        <button type="button" (click)="generarPdfInterno()" class="btn btn-outline-secondary px-4 py-2.5 fw-semibold d-inline-flex align-items-center gap-2 me-2">
                            <i class="bi bi-file-earmark-pdf-fill text-danger fs-5"></i>
                            PDF Interno (Gerente)
                        </button>
                        <button type="button" (click)="generarPdfCliente()" class="btn btn-outline-primary px-4 py-2.5 fw-semibold d-inline-flex align-items-center gap-2 me-2">
                            <i class="bi bi-file-earmark-pdf-fill fs-5"></i>
                            PDF Cliente
                        </button>
                        <button type="button" (click)="actualizarCotizacion()" class="btn btn-primary px-5 py-2.5 fw-semibold d-inline-flex align-items-center gap-2" [disabled]="isSaving">
                            @if (isSaving) {
                                <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                                Procesando...
                            } @else {
                                <i class="bi bi-arrow-repeat fs-5"></i>
                                Actualizar Cotización
                            }
                        </button>
                    }
                </div>
            </div>

        </div>
    </div>
</div>
