<div class="row g-3 py-3 border-bottom">
    <div class="col-md-4">
        <span class="text-muted small fw-bold text-uppercase d-block mb-1" style="letter-spacing: 0.5px; font-size: 0.7rem;">Número de Documento</span>
        <div class="p-3 bg-light rounded-3 border border-light-subtle">
            <span class="fw-bold text-dark fs-5">#00{{ idCotizacion || 'NUEVA' }}</span>
        </div>
    </div>
    <div class="col-md-4">
        <span class="text-muted small fw-bold text-uppercase d-block mb-1" style="letter-spacing: 0.5px; font-size: 0.7rem;">Usuario Asignado</span>
        <div class="p-3 bg-light rounded-3 border border-light-subtle">
            <span class="fw-semibold text-secondary fs-5">{{ usuarioUsername || 'Sistema' }}</span>
        </div>
    </div>
    <div class="col-md-4">
        <span class="text-muted small fw-bold text-uppercase d-block mb-1" style="letter-spacing: 0.5px; font-size: 0.7rem;">Fecha de Registro</span>
        <div class="p-3 bg-light rounded-3 border border-light-subtle">
            <span class="fw-semibold text-secondary fs-5">{{ fecha || '-' }}</span>
        </div>
    </div>
</div>
