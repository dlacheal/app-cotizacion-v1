<div class="row my-12">
    <div class="col-3">
        <h5>Moneda</h5>
        <ul class="list-group">
            <li class="list-group-item">{{ monedaCodigo }} - {{ monedaDescripcion}}</li>
        </ul>
    </div>
    <div class="col-3">
        <h5>Forma de pago</h5>
        <ul class="list-group">
            <li class="list-group-item">{{ formaPagoNombre }}</li>
        </ul>
    </div>
    <div class="col-3">
        <h5>Estado</h5>
        <ul class="list-group">
            <li class="list-group-item">{{ estadoNombre }}</li>
        </ul>
    </div>
    <div class="col-3">
        <h5>Validez</h5>
        <ul class="list-group">
            <li class="list-group-item">{{ validezDias }} días</li>
        </ul>
    </div>
    <div class="col-6">
        <h5>Observaciones</h5>
        <ul class="list-group">
            <li class="list-group-item">
                <textarea class="form-control" rows="3" readonly>{{ observaciones }}</textarea>
            </li>
        </ul>
    </div>
</div>
