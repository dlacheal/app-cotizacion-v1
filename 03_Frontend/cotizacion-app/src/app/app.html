<div class="d-flex flex-column min-vh-100 bg-light">
  <!-- Cabecera modular -->
  @if (authService.isLoggedIn()) {
    <app-head-page></app-head-page>
  }

  <!-- Contenido principal -->
  <main class="flex-grow-1 container my-4 d-flex flex-column justify-content-center">
    @if (authService.isLoggedIn()) {
      <div class="card shadow-sm p-4 bg-white rounded border-0 flex-grow-1">
        <router-outlet></router-outlet>
      </div>
    } @else {
      <router-outlet></router-outlet>
    }
  </main>

  <!-- Pie de página modular -->
  @if (authService.isLoggedIn()) {
    <app-foot-page></app-foot-page>
  }
</div>
