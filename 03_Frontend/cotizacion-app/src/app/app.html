@if (authService.isLoggedIn()) {
  <div class="app-layout-wrapper bg-light">
    <!-- Contenedor del Sidebar Lateral Izquierdo -->
    <div class="app-sidebar-container">
      <app-head-page></app-head-page>
    </div>

    <!-- Contenedor del Contenido Principal Derecho -->
    <div class="app-content-container d-flex flex-column min-vh-100">
      <main class="flex-grow-1 p-3 p-lg-4">
        <div class="card shadow-sm p-4 bg-white rounded border-0 h-100">
          <router-outlet></router-outlet>
        </div>
      </main>

      <!-- Pie de página al pie de la columna derecha -->
      <app-foot-page></app-foot-page>
    </div>
  </div>
} @else {
  <div class="d-flex flex-column min-vh-100 align-items-center justify-content-center bg-light">
    <main class="w-100">
      <router-outlet></router-outlet>
    </main>
  </div>
}
