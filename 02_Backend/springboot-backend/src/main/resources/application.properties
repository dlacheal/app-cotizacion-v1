# -----------------------------------------------------------
# 1. INFORMACION BASICA Y PUERTO
# -----------------------------------------------------------
spring.application.name=App cotizacion v1
server.port=8081

# -----------------------------------------------------------
# 2. CONFIGURACION DE LA BASE DE DATOS (PostgreSQL)
# -----------------------------------------------------------

# Configuracion Localhost (Activa)
spring.datasource.url=jdbc:postgresql://localhost:5432/db_cotizacion_v1
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion Docker (Comentada)
# spring.datasource.url=jdbc:postgresql://host.docker.internal:5432/db_cotizacion_v1
# spring.datasource.url=jdbc:postgresql://postgres12:5432/db_cotizacion_v1

# -----------------------------------------------------------
# 3. CONFIGURACION DE JPA / HIBERNATE
# -----------------------------------------------------------
#spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.generate-ddl=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Nivel de logging para ver las consultas SQL generadas por Hibernate
logging.level.org.hibernate.SQL=debug

# -----------------------------------------------------------
# 4. CONFIGURACION MULTIPART / SUBIDA DE ARCHIVOS
# -----------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# -----------------------------------------------------------
# 5. RUTAS DE IMAGEN (Manteniendo el formato original y comentadas)
# -----------------------------------------------------------
